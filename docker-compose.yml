services:
  watcher:
    build: .
    container_name: watcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    env_file:
      - .env
    # Note: Environment variables in .env take precedence over these defaults
    environment:
      - TZ=${TZ:-UTC}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-86400}
      - SCHEDULE_TIME=${SCHEDULE_TIME:-}
      - DRY_RUN=${DRY_RUN:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NOTIFY_UPDATES_AVAILABLE=${NOTIFY_UPDATES_AVAILABLE:-true}
      - NOTIFY_ON_UPDATE_START=${NOTIFY_ON_UPDATE_START:-true}
      - NOTIFY_SUMMARY_STRATEGY=${NOTIFY_SUMMARY_STRATEGY:-always}
      - FAILURE_COOLDOWN_SECONDS=${FAILURE_COOLDOWN_SECONDS:-3600}
      - MAX_RETRIES_BEFORE_COOLDOWN=${MAX_RETRIES_BEFORE_COOLDOWN:-1}
      - JOURNAL_ENABLED=${JOURNAL_ENABLED:-true}
      - JOURNAL_PATH=${JOURNAL_PATH:-data/journal.json}
      - STATE_PATH=${STATE_PATH:-data/state.json}
      - JOURNAL_MAX_ENTRIES=${JOURNAL_MAX_ENTRIES:-100}
      - MAX_UPDATES_PER_CYCLE=${MAX_UPDATES_PER_CYCLE:-0}
      - RESTART_DEPENDENTS=${RESTART_DEPENDENTS:-true}
      - NOTIFY_ON_STARTUP=${NOTIFY_ON_STARTUP:-true}
      - EXCLUDE_CONTAINER_NAMES=${EXCLUDE_CONTAINER_NAMES:-}
      - EXCLUDE_CONTAINER_REGEX=${EXCLUDE_CONTAINER_REGEX:-}
    labels:
      - "watcher.self=true"
    restart: unless-stopped
    stop_grace_period: 2m # Allow Watcher to finish current updates gracefully
