services:
  watcher:
    build: .
    container_name: watcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    env_file:
      - .env
    # Note: Environment variables in .env take precedence over these defaults
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-86400}
      - ALLOW_USER_FALLBACK=${ALLOW_USER_FALLBACK:-false}
      - NOTIFY_UPDATES_AVAILABLE=${NOTIFY_UPDATES_AVAILABLE:-true}
      - JOURNAL_PATH=${JOURNAL_PATH:-/app/data/journal.json}
      - STATE_PATH=${STATE_PATH:-/app/data/state.json}
    labels:
      - "watcher.self=true"
    restart: unless-stopped
    stop_grace_period: 2m # Allow Watcher to finish current updates gracefully
