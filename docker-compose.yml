services:
  watcher:
    build: .
    container_name: watcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - CHECK_INTERVAL=${CHECK_INTERVAL:-300}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DRY_RUN=${DRY_RUN:-false}
    restart: unless-stopped
